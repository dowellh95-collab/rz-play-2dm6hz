<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ROADZTER">
<meta name="theme-color" content="#05030e"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>ROADZTER</title>
<style>html,body{margin:0;height:100%;background:#05030e;color:#fff;font:16px -apple-system,system-ui,Segoe UI,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 70% 25%,#3a0b4f,#05030e 70%)}
#box{width:min(360px,86vw);padding:26px 24px;border:1px solid #20e3ff66;border-radius:16px;background:#0b0620cc;box-shadow:0 0 30px #ff2bd633;text-align:center}
h1{margin:0 0 4px;font-size:30px;letter-spacing:2px;color:#bff6ff;text-shadow:0 0 14px #20e3ff}
p{margin:0 0 16px;color:#ffffffaa;font-size:14px}
input[type=password]{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #20e3ff88;background:#05030e;color:#fff;font-size:17px;outline:none;-webkit-user-select:text;user-select:text}
label{display:block;margin:12px 0 16px;color:#ffffffcc;font-size:14px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#ffd23f;color:#1a0830;font-weight:800;font-size:18px;letter-spacing:1px}
#msg{min-height:20px;margin-top:10px;color:#ff7a8a;font-size:14px}</style></head>
<body><form id="box" autocomplete="on"><h1>ROADZTER</h1><p>Private build. Enter the password to play.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
<label><input id="rem" type="checkbox" checked> Remember on this device</label>
<button id="go" type="submit">PLAY</button><div id="msg"></div></form>
<script>(function(){
 var KEY="rzKey1",B=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});},S=crypto.subtle,box=document.getElementById("box"),msg=document.getElementById("msg");
 if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(function(){});
 function payload(){return fetch("game.enc.json",{cache:"no-cache"}).catch(function(){return caches.match("game.enc.json",{ignoreSearch:true});}).then(function(r){if(!r||!r.ok)throw new Error("offline");return r.json();});}
 function run(p,key){return S.decrypt({name:"AES-GCM",iv:B(p.iv)},key,B(p.ct)).then(function(buf){var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();});}
 function fromPw(p,pw){return S.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(b){return S.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:B(p.salt),iterations:p.iter},b,{name:"AES-GCM",length:256},true,["decrypt"]);});}
 var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
 if(saved){box.style.visibility="hidden";payload().then(function(p){return S.importKey("raw",B(saved),"AES-GCM",false,["decrypt"]).then(function(k){return run(p,k);});}).catch(function(e){if(e&&e.message==="offline")msg.textContent="Connect to the internet once to load the game.";else{try{localStorage.removeItem(KEY);}catch(_){} }box.style.visibility="visible";});}
 box.addEventListener("submit",function(ev){ev.preventDefault();var pw=document.getElementById("pw").value.trim();if(!pw)return;msg.style.color="#bff6ff";msg.textContent="Unlocking\u2026";document.getElementById("go").disabled=true;
  payload().then(function(p){return fromPw(p,pw).then(function(k){return S.decrypt({name:"AES-GCM",iv:B(p.iv)},k,B(p.ct)).then(function(){return S.exportKey("raw",k).then(function(raw){if(document.getElementById("rem").checked){try{localStorage.setItem(KEY,btoa(String.fromCharCode.apply(null,new Uint8Array(raw))));}catch(_){}}return run(p,k);});});});})
  .catch(function(e){msg.style.color="#ff7a8a";msg.textContent=(e&&e.message==="offline")?"Connect to the internet once to load the game.":"Wrong password.";document.getElementById("go").disabled=false;});});
})();</script></body></html>
